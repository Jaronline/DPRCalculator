<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DPR Calculator</title>

</head>
<body>

<form action="#" class="p-fluid" id="dprForm">
    <fieldset id="round.0">
        <legend>
            <span>Round #1</span>
        </legend>
        <button type="button" id="round.0.newRoundButton">+</button>
        <button type="button" id="round.0.removeRoundButton">-</button>
        <fieldset class="p-fieldset p-component" id="round.0.attack.0">
            <legend>
                <span>Attack #1</span>
            </legend>
            <button type="button" id="round.0.attack.0.newAttackButton">
                <span class="plus">+</span>
            </button>
            <button type="button" id="round.0.attack.0.copyAttackButton">
                <span class="copy">&</span>
            </button>
            <button type="button" id="round.0.attack.0.removeAttackButton">
                <span class="trash">-</span>
            </button>

            <!-- hitChance -->
            <div>
            <label for="round.0.attack.0.hitChance" class="p-d-block">Min. to Hit</label>
            <span>
                <input role="spinbutton"
                       class="p-inputtext p-component p-filled p-inputnumber-input"
                       type="text" inputmode="numeric"
                       id="round.0.attack.0.hitChance"
                       name="round.0.attack.0.hitChance" min="2" max="20"
                       aria-valuemin="2" aria-valuemax="20"
                       aria-valuenow="8" value="8"/>
            </span>
                </div>

            <!-- critRange -->
            <div>
            <label for="round.0.attack.0.critRange" class="p-d-block">Min. to Crit</label>
            <span>
                <input role="spinbutton"
                       class="p-inputtext p-component p-filled p-inputnumber-input"
                       type="text" inputmode="numeric"
                       id="round.0.attack.0.critRange"
                       name="round.0.attack.0.critRange" min="2" max="20"
                       aria-valuemin="2" aria-valuemax="20"
                       aria-valuenow="20" value="20"/>
            </span>
                </div>


            <!-- hitChanceArrayIndex -->
            <div>
            <label>
                Accuracy Type
                <select id="round.0.attack.0.hitChanceArrayIndex" name="round.0.attack.0.hitChanceArrayIndex" tabindex="-1" aria-hidden="true">
                    <option value="0">Disadvantage</option>
                    <option value="1" selected>Standard</option>
                    <option value="2">Advantage</option>
                    <option value="3">Elven Accuracy</option>
                </select>
            </label>
                </div>

            <!-- halflingLucky -->
            <div>
            <label class="p-d-block" for="round.0.attack.0.halflingLucky">Halfling?</label>
            <span id="round.0.attack.0.halflingLucky"></span>
                </div>

            <!-- attacks multiplier -->
            <div>
            <label for="round.0.attack.0.multiplier" class="p-d-block">Attacks/Turn</label>
                <span>
                    <input role="spinbutton"
                           id="round.0.attack.0.multiplier"
                           class="p-inputtext p-component p-filled p-inputnumber-input"
                           type="text" inputmode="numeric"
                           name="round.0.attack.0.multiplier" min="1"
                           aria-valuemin="1" aria-valuenow="1" value="1">
                </span>
            </div>

            <!-- damageOnHit -->
            <div>
            <label
                    for="round.0.attack.0.damageOnHit">Damage On Hit</label>
            <input
                    name="round.0.attack.0.damageOnHit" class="p-inputtext p-component p-filled"
                    id="round.0.attack.0.damageOnHit" value="12">
                </div>

            <!--damageOnHit average -->
            <div><label class="p-d-block">Average</label>
                <span id="round.0.attack.0.damageOnHitAverage"></span>
            </div>

            <!-- damageNotMultiplied -->
            <div><label for="round.0.attack.0.damageNotMultiplied">Additional Damage NOT multiplied Critical Hit</label>
                <input
                        name="round.0.attack.0.damageNotMultiplied" class="p-inputtext p-component p-filled"
                        id="round.0.attack.0.damageNotMultiplied" value="2+2"></div>

            <!-- damageNotMultiplied average -->
            <div><label class="p-d-block">Average</label>
                <span id="round.0.attack.0.damageNotMultipliedAverage"></span>
            </div>

            <!-- damageOnCritFlat -->
            <div><label for="round.0.attack.0.damageOnCritFlat">Damage Bonus on Crit (Not Multiplied)</label>
            <input
                    name="round.0.attack.0.damageOnCritFlat" class="p-inputtext p-component"
                    id="round.0.attack.0.damageOnCritFlat" value=""></div>

            <!-- damageOnCritFlat average -->
            <div><label class="p-d-block">Average</label>
            <span id="round.0.attack.0.damageOnCritFlatAverage"></span>
            </div>

            <!-- damageOnCritMultiplied -->
            <div><label for="round.0.attack.0.damageOnCritMultiplied">Damage Bonus on Crit (Dice Multiplied)</label>
            <input
                    name="round.0.attack.0.damageOnCritMultiplied" class="p-inputtext p-component"
                    id="round.0.attack.0.damageOnCritMultiplied" value=""></div>

            <!-- damageOnCritMultiplied average -->
            <div><label class="p-d-block">Average</label>
            <span id="round.0.attack.0.damageOnCritMultipliedAverage"></span>
            </div>

            <!-- damageOnMiss -->
            <div><label for="round.0.attack.0.damageOnMiss">Damage Dealt on Miss</label>
            <input
                    name="round.0.attack.0.damageOnMiss" class="p-inputtext p-component"
                    id="round.0.attack.0.damageOnMiss" value=""></div>

            <!-- damageOnMiss average -->
            <div><label class="p-d-block">Average</label>
            <span id="round.0.attack.0.damageOnMissAverage"></span>
            </div>
        </fieldset>
    </fieldset>
</form>

<div>
    <table id="outputDPR">
    </table>
</div>
<script src="index.js"></script>
<script type="module" src="buttonListeners.js"></script>
</body>
</html>
